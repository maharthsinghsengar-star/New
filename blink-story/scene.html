<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const main = document.getElementById('c');
let ctx = main.getContext('2d');
const PI = Math.PI;

// ---------- utils ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647, (s - 1) / 2147483646); }
function hex2rgb(h) { if (h.startsWith('rgb')) return h.match(/\d+/g).slice(0, 3).map(Number); h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function shade(h, f) {
  const [r, g, b] = hex2rgb(h);
  const m = v => clamp(Math.round(f >= 1 ? v + (255 - v) * (f - 1) : v * f), 0, 255);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function poly(pts, fill) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
// faux-3D block: front face + right side + top
function box3d(x, y, w, h, d, col, r = 0) {
  const dx = d * 0.6, dy = -d * 0.45;
  poly([x, y, x + dx, y + dy, x + w + dx, y + dy, x + w, y], shade(col, 1.28));
  poly([x + w, y, x + w + dx, y + dy, x + w + dx, y + h + dy, x + w, y + h], shade(col, 0.7));
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, shade(col, 1.1)); g.addColorStop(1, shade(col, 0.92));

}
function withCtx(c, fn) { const o = ctx; ctx = c; fn(); ctx = o; }
function camera(cx, cy, z, rot = 0) { ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.rotate(rot); ctx.translate(-cx, -cy); }
function shake(t, amt) { ctx.translate(Math.sin(t * 91) * amt, Math.cos(t * 77) * amt); }

// ---------- avatar ----------
function limb(x, y, w, h, d, col, endCol, ang, split) {
  const px = x + w / 2, py = y + w * 0.3;
  ctx.save(); ctx.translate(px, py); ctx.rotate(ang); ctx.translate(-px, -py);
  box3d(x, y, w, h, d, endCol, w * 0.12);
  box3d(x, y, w, h * split, d, col, w * 0.08);
  ctx.restore();
}
function armTo(sx, sy, tx, ty) { return Math.atan2(-(tx - sx), ty - sy); }

function avatar(o) {
  const u = o.u, cx = o.x, fy = o.y, t = o.t || 0;
  const skin = o.skin || '#ffd23f', shirt = o.shirt || '#2ec4b6', pants = o.pants || '#3a5bd9';
  const d = 0.42 * u;
  const walking = o.walk !== undefined;
  const wa = walking ? (o.walkAmp ?? 0.5) : 0;

    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath();

  ctx.translate(o.dx || 0, -bob - (o.lift || 0));

    ctx.fillStyle = shade(o.hairCol || '#ff8c42', 0.85);

  limb(cx, fy - 2 * u, u, 2 * u, d, pants, shoe, -legA, 0.82);

  else if (det === 'heart') { heart(cx, fy - 3.1 * u, 0.36 * u, o.detailCol || '#ff2e63'); }
  else if (det === 'bolt') { poly([cx + 0.1 * u, fy - 3.7 * u, cx - 0.35 * u, fy - 2.95 * u, cx - 0.02 * u, fy - 2.95 * u, cx - 0.15 * u, fy - 2.3 * u, cx + 0.38 * u, fy - 3.15 * u, cx + 0.05 * u, fy - 3.15 * u], o.detailCol || '#fff15c'); }
  else if (det === 'neon') { ctx.fillStyle = o.detailCol || '#00f5ff'; ctx.fillRect(cx - u, fy - 3.6 * u, 2 * u, 0.12 * u); ctx.fillRect(cx - u, fy - 2.7 * u, 2 * u, 0.12 * u); }
  limb(cx + u, fy - 4 * u, u, 2 * u, d, shirt, skin, o.armR ?? (legA * 0.9), 0.48);
  head(cx, fy - 4 * u, u, o, skin, t);

    // eye-drop bottle above right eye
    const bx = cx + 0.27 * u, by = fy - 5.45 * u;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(PI);
    box3d(-0.13 * u, -0.5 * u, 0.26 * u, 0.42 * u, 0.1 * u, '#ffffff', 0.05 * u);
    ctx.fillStyle = '#4cc9f0'; ctx.fillRect(-0.13 * u, -0.36 * u, 0.26 * u, 0.14 * u);
    poly([-0.07 * u, -0.08 * u, 0.07 * u, -0.08 * u, 0.02 * u, 0.08 * u, -0.02 * u, 0.08 * u], '#e8e8e8');
    ctx.restore();
    const dp = (t * 1.6) % 1;
    ctx.fillStyle = '#5ad1ff';
    ctx.beginPath(); ctx.ellipse(bx, by + 0.12 * u + dp * 0.55 * u, 0.045 * u, 0.065 * u, 0, 0, PI * 2); ctx.fill();

}
function star(x, y, R, r, col) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -PI / 2 + i * PI / 5, rad = i % 2 ? r : R; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }

}
function heart(x, y, s, col) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);

  ctx.bezierCurveTo(x + s * 0.6, y - s * 0.9, x + s * 1.3, y, x, y + s * 0.9);

function head(cx, bottom, u, o, skin, t) {

  g.addColorStop(0, shade(skin, 1.18)); g.addColorStop(1, shade(skin, 0.94));

function hair(cx, x, y, hw, hh, u, o) {
  const hc = o.hairCol || '#3b2416', h = o.hair;

    const cc = o.capCol || '#e63946';
    ctx.fillStyle = shade(cc, 0.7); rr(x + 0.2 * u, y - 0.3 * u, hw, 0.55 * u, 0.3 * u); ctx.fill();
    ctx.fillStyle = cc; rr(x - 0.04 * u, y - 0.14 * u, hw + 0.08 * u, 0.5 * u, 0.3 * u); ctx.fill();
    ctx.fillStyle = shade(cc, 0.82); rr(x - 0.25 * u, y + 0.26 * u, hw * 0.72, 0.13 * u, 0.06 * u); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx + 0.05 * u, y + 0.08 * u, 0.1 * u, 0, PI * 2); ctx.fill();
  } else if (h === 'spiky') {
    ctx.fillStyle = hc; rr(x - 0.04 * u, y - 0.08 * u, hw + 0.1 * u, 0.4 * u, 0.2 * u); ctx.fill();
    for (let i = 0; i < 5; i++) { const sx = x + i * hw / 4.6; poly([sx, y + 0.05 * u, sx + 0.18 * u, y - 0.38 * u, sx + 0.36 * u, y + 0.05 * u], hc); }
  } else if (h === 'flat') {
    ctx.fillStyle = shade(hc, 0.75); rr(x + 0.18 * u, y - 0.26 * u, hw, 0.45 * u, 0.25 * u); ctx.fill();
    ctx.fillStyle = hc; rr(x - 0.04 * u, y - 0.12 * u, hw + 0.08 * u, 0.38 * u, 0.25 * u); ctx.fill();
  } else if (h === 'bob' || h === 'long') {
    ctx.fillStyle = hc; rr(x - 0.08 * u, y - 0.14 * u, hw + 0.16 * u, 0.42 * u, 0.3 * u); ctx.fill();
    ctx.fillRect(x - 0.08 * u, y, 0.2 * u, hh * 0.8); ctx.fillRect(x + hw - 0.12 * u, y, 0.2 * u, hh * 0.8);

  } else if (h === 'mohawk') {
    ctx.fillStyle = hc; rr(cx - 0.18 * u, y - 0.45 * u, 0.36 * u, 0.6 * u, 0.15 * u); ctx.fill();

}
function face(cx, cy, u, o, t) {

      }
      ctx.strokeStyle = ink; ctx.lineWidth = 0.03 * u; ctx.beginPath(); ctx.ellipse(x, ey, rx, ry, 0, 0, PI * 2); ctx.stroke();

  } else if (ex2 === 'shock' || ex2 === 'panic') {
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * 0.27 * u, ey - 0.25 * u, 0.13 * u, PI * 1.2, PI * 1.8); ctx.stroke(); }

  const my = cy + 0.2 * u;
  ctx.lineWidth = 0.06 * u;

    ctx.fillStyle = '#3a0d0d'; ctx.beginPath(); ctx.ellipse(cx, my + 0.08 * u, 0.12 * u, open * u, 0, 0, PI * 2); ctx.fill();

// ---------- fx ----------
function bubble(text, x, y, p = 1, size = 46, col = '#ffffff', tcol = '#1a1a1a') {

const POOFCOLS = ['#ff4d6d', '#ffd60a', '#06d6a0', '#4cc9f0', '#b5179e', '#ff9f1c', '#ffffff'];
