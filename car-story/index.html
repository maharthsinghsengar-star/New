<style>

@font-face { font-family: Poppins; font-weight: 800; src: url(node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2) format('woff2'); }
html, body { margin: 0; background: #000; overflow: hidden; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Poppins, sans-serif; color: #fff; }
#c { position: absolute; inset: 0; width: 1080px; height: 1920px; filter: saturate(1.1) contrast(1.04); }
.shade { position: absolute; left: 0; right: 0; pointer-events: none; }

#label { display: inline-block; margin-top: 22px; padding: 12px 34px; border-radius: 40px; background: #ffc93c; color: #1b1b1b; font-weight: 600; font-size: 38px; box-shadow: 0 8px 26px rgba(0,0,0,.3); }
#title { position: absolute; top: 300px; left: 0; right: 0; text-align: center; }
#title small, #end small { display: block; font-weight: 800; font-size: 44px; letter-spacing: 10px; color: #ffc93c; -webkit-text-stroke: 10px #000; paint-order: stroke fill; }

#sub { position: absolute; left: 50%; bottom: 350px; transform: translateX(-50%); white-space: nowrap; font-weight: 800; font-size: 104px; line-height: 1; color: #fff; -webkit-text-stroke: 20px #000; paint-order: stroke fill; }
#strokes { position: absolute; top: 560px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
#strokes span { padding: 10px 20px; border-radius: 14px; background: rgba(0,0,0,.45); font-weight: 600; font-size: 28px; color: rgba(255,255,255,.6); }
#strokes span.on { background: #ffc93c; color: #1b1b1b; }

#bar { height: 100%; width: 0; background: #ffc93c; }
