# MASTER SHOT LIST — "The Hospital's 13th Floor"
# Single source of truth. Every script reads this file. Edit here, then re-run scripts/run_all.sh
#
# Per-shot fields
#   id/ch/loc/chars       shot number, chapter, location, characters present
#   cam                   camera angle + movement (directing note, goes into prompts)
#   move                  animatic camera move: static|push|push_slow|dolly|pull|pan_l|pan_r|tilt_u|tilt_d|drift|handheld
#   act / emo             character action / emotion
#   desc                  visual description for the keyframe prompt (characters are auto-injected from characters.yaml)
#   anim                  animation notes for the image-to-video prompt
#   audio                 sequential events: {narr:[in,out]} narrator.mp3 range | {cue: ID} voice_cues.yaml | {gap: s}
#                         Shot duration = head + events (+0.35 s default gaps) + tail, never below `dur`.
#   sfx                   [[sound_effect_id, seconds_from_shot_start, gain_db], ...]
#   amb / mus             ambience bed / music cue that STARTS at this shot (persists until changed; "none" stops)
#   kf                    placeholder keyframe recipe for the animatic (scripts/05_make_keyframes.py)
#   kf2                   optional second keyframe; the animatic crossfades kf -> kf2 over `x` (fractions of the shot)
#   grade / fx            colour grade and per-frame effects for the animatic (flicker, flicker_hard, shake, cctv, blackout)
#   fade_in / fade_out    seconds of fade from/to black

defaults: {head: 0.3, tail: 0.5, gap: 0.3, dur: 3.0, move: push_slow, grade: night}

chapters:
  1: THE LAST CALL
  2: THE WRONG FLOOR
  3: THE FORBIDDEN WARD
  4: THE PATIENTS
  5: THE LITTLE GIRL
  6: THE MEDICAL RECORD
  7: THE OLD DOCTOR
  8: THE CORRIDOR
  9: THE ESCAPE
  10: THE TWIST

