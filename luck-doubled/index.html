<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Luck Doubled</title>
<style>

@font-face { font-family: Poppins; font-weight: 600; src: url(node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 800; src: url(node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2) format('woff2'); }
html, body { margin: 0; background: #000; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Poppins, sans-serif; color: #fff; }
#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#tint { position: absolute; inset: 0; opacity: 0; mix-blend-mode: soft-light; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%); opacity: .3; }
/* luck counter, top left */
#luck { position: absolute; left: 44px; top: 40px; zoom: 1.2; display: flex; align-items: center; gap: 20px; padding: 16px 30px 16px 18px; border-radius: 28px;
  background: linear-gradient(135deg, rgba(10,60,30,.62), rgba(5,30,20,.5)); border: 3px solid rgba(160,255,190,.55); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
#luck svg { width: 84px; height: 84px; filter: drop-shadow(0 0 10px rgba(120,255,150,.7)); }
#luck .day { font-weight: 600; font-size: 26px; letter-spacing: 5px; color: #c8ffd6; }
#luck .val { font-weight: 800; font-size: 54px; line-height: 1.05; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
#luck .val b { color: #ffe066; }
#luck.gold { background: linear-gradient(135deg, rgba(120,80,0,.66), rgba(60,40,0,.5)); border-color: rgba(255,224,102,.85); }
/* small calm captions */
#caps { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; }
.cap { display: inline-block; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); white-space: nowrap; font-weight: 500; font-size: 40px; line-height: 1.3; opacity: 0;
  padding: 10px 30px; border-radius: 40px; background: rgba(0,0,0,.38); text-shadow: 0 2px 6px rgba(0,0,0,.6); }
.cap b { font-weight: 800; color: #ffe066; }
.cap.title { font-size: 64px; font-weight: 800; background: rgba(0,0,0,.3); padding: 16px 44px; }
.cap.title b { color: #9dffb0; }
#fade { position: absolute; inset: 0; background: #000; opacity: 1; }
#glow { position: absolute; inset: 0; background: #fff8e6; opacity: 0; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>

<div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="tint"></div><div id="vig"></div>
  <div id="luck"><svg viewBox="0 0 100 100"><g fill="#3ddc62" stroke="#0d5c22" stroke-width="3">
    <path d="M50 50 C30 48 18 30 30 20 C40 12 50 22 50 32 C50 22 60 12 70 20 C82 30 70 48 50 50Z" transform="rotate(0 50 50)"/>
    <path d="M50 50 C30 48 18 30 30 20 C40 12 50 22 50 32 C50 22 60 12 70 20 C82 30 70 48 50 50Z" transform="rotate(90 50 50)"/>
    <path d="M50 50 C30 48 18 30 30 20 C40 12 50 22 50 32 C50 22 60 12 70 20 C82 30 70 48 50 50Z" transform="rotate(180 50 50)"/>
    <path d="M50 50 C30 48 18 30 30 20 C40 12 50 22 50 32 C50 22 60 12 70 20 C82 30 70 48 50 50Z" transform="rotate(270 50 50)"/></g>
    <path d="M52 52 Q60 75 54 95" stroke="#1f8a3a" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
    <div><div class="day">DAY 1</div><div class="val">LUCK <b>×1</b></div></div></div>
  <div id="caps"></div>
  <div id="glow"></div>
  <div id="fade"></div>
</div>

</html>
